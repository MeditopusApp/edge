name: build

on:
  push:
    tags: ['v*']        # the only trigger: pushing a version tag cuts a release

permissions:
  contents: write       # needed to create the GitHub Release

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable

      # Backend URL comes from a repo secret, written into .env at build time.
      - name: Write .env
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
        run: printf 'BACKEND_URL=%s\n' "$BACKEND_URL" > .env

      # Decode the release keystore from a secret. The gradle config picks these
      # env vars up (ANDROID_KEYSTORE_PATH etc.) and signs the release build.
      - name: Restore release keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - run: flutter pub get

      - name: Build release APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: flutter build apk --release --dart-define-from-file=.env

      - name: Name the APK after the version
        id: rename
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/openstrap-edge-${GITHUB_REF_NAME}.apk
          echo "apk=dist/openstrap-edge-${GITHUB_REF_NAME}.apk" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: openstrap-edge-apk
          path: ${{ steps.rename.outputs.apk }}

      # Publish a Release with the signed APK attached so people download a real
      # .apk, not a zipped CI artifact.
      - name: Publish release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: ${{ steps.rename.outputs.apk }}
          generate_release_notes: true
