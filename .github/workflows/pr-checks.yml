name: PR checks

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: edge-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  flutter-checks:
    name: Flutter analyze and protocol tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout PR merge commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          # .metadata на edge PR #1 d5e40c1e1bc0a2fec8023056e48d2065e0ae2591:
          # revision db50e20168db8fee486b9abf32fc912de3bc5b6a = Flutter 3.41.6.
          # Официальный Linux manifest: stable, x64, Dart 3.11.4 (2026-03-26).
          # https://storage.googleapis.com/flutter_infra_release/releases/releases_linux.json
          # SDK pins test_api 0.7.10 и vector_math 2.2.0 совпадают с pubspec.lock.
          # https://github.com/flutter/flutter/blob/db50e20168db8fee486b9abf32fc912de3bc5b6a/packages/flutter_test/pubspec.yaml
          # Сопоставлено 2026-11-16; pub get и тесты локально не запускались.
          flutter-version: '3.41.6'
          cache: 'false'
          pub-cache: 'false'

      - name: Show SDK versions
        run: flutter --version

      - name: Install locked dependencies
        id: dependencies
        run: flutter pub get --enforce-lockfile

      - name: Analyze Dart
        run: flutter analyze --no-pub

      # R24 golden tests need whoop_hist.jsonl, absent from this repository.
      - name: Test self-contained protocol cases
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: >-
          flutter test --no-pub test/protocol_test.dart
          --exclude-name '^R24 decode against golden fixture'
